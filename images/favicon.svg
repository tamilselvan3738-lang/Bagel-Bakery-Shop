<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Baker's Steam -->
  <path d="M46 18 Q44 11 47 6" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <path d="M54 18 Q56 11 53 6" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.85" />

  <defs>
    <radialGradient id="favCrust" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>
  </defs>

  <!-- Dark Background Disk with Gold Ring -->
  <circle cx="50" cy="52" r="46" fill="#1C120B" stroke="#D97706" stroke-width="2.5" />

  <!-- Bagel Crust -->
  <circle cx="50" cy="54" r="32" fill="url(#favCrust)" stroke="#FDE68A" stroke-width="1.5" />
  <path d="M26 40 C33 28 67 28 74 40" stroke="#FFFDF7" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- Bagel Hole -->
  <ellipse cx="50" cy="54" rx="11" ry="10.5" fill="#1C120B" stroke="#78350F" stroke-width="1.8" />
  <ellipse cx="50" cy="54" rx="8" ry="7.5" fill="#120A05" />

  <!-- Toasted Sesame Specks -->
  <ellipse cx="37" cy="41" rx="2" ry="1.1" transform="rotate(-30 37 41)" fill="#FFFDF7" />
  <ellipse cx="50" cy="35" rx="2" ry="1.1" transform="rotate(10 50 35)" fill="#FFFDF7" />
  <ellipse cx="63" cy="41" rx="2" ry="1.1" transform="rotate(35 63 41)" fill="#FFFDF7" />
  <ellipse cx="41" cy="69" rx="2" ry="1.1" transform="rotate(20 41 69)" fill="#FFFDF7" />
  <ellipse cx="59" cy="69" rx="2" ry="1.1" transform="rotate(-20 59 69)" fill="#FFFDF7" />

  <!-- Poppy Seed Dots -->
  <circle cx="33" cy="50" r="1.2" fill="#3D2110" />
  <circle cx="67" cy="50" r="1.2" fill="#3D2110" />
  <circle cx="50" cy="73" r="1.2" fill="#3D2110" />

  <!-- Certified Seal Pin -->
  <circle cx="82" cy="18" r="10" fill="#F59E0B" stroke="#451A03" stroke-width="1.5" />
  <path d="M82 12 L84.2 16.5 L89 17.2 L85.5 20.6 L86.3 25.4 L82 23.1 L77.7 25.4 L78.5 20.6 L75 17.2 L79.8 16.5 Z" fill="#451A03" />
